[importlinter]
root_package = src

[importlinter:contract:layers]
name = Enforce strict layering
type = layers
layers =
    src.orchestration
    src.document_classification | src.entity_extraction | src.document_summarization
    src.interfaces
    src.shared

[importlinter:contract:no-direct-component-imports]
name = Components must communicate through interfaces
type = forbidden
source_modules =
    src.document_classification
    src.entity_extraction
    src.document_summarization
forbidden_modules =
    src.document_classification
    src.entity_extraction
    src.document_summarization
allow_indirect_imports = true
