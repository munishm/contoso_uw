[project]
name = "hsbc-document-classification"
version = "0.1.1"
description = "Document classification component for HSBC underwriting automation"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-documentintelligence>=1.0.0",
    "azure-core>=1.29.0",
    "azure-identity>=1.15.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "pikepdf==10.1.0",
    "pdf2image>=1.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
