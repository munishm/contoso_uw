[project]
name = "contoso-document-summarization"
version = "0.1.0"
description = "Document summarization component for Contoso Bank underwriting automation"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "azure-core>=1.29.0",
    "pydantic>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
