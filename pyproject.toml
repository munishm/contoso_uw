[project]
name = "hsbc-iwpb-uw"
version = "0.1.0"
description = "HSBC Insurance Underwriting Automation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi[standard]>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.1.0",
    "azure-cosmos>=4.5.0",
    "azure-storage-blob>=12.19.0",
    "azure-servicebus>=7.11.0",
    "azure-identity>=1.15.0",
    "azure-monitor-opentelemetry>=1.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.7.0",
    "import-linter>=2.0.0",
    "ruff>=0.1.0",
    "httpx>=0.27.0",
]
all = [
    "hsbc-iwpb-uw[api,dev]",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]

[tool.uv.workspace]
members = [
    "src/document_classification",
    "src/entity_extraction",
    "src/document_summarization",
]

[tool.uv.sources]
# Local workspace packages
hsbc-iwpb-uw = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
